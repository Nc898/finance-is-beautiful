<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Bread and Butter - shop scene harness</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #FBF6EA; font: 12px/1.35 system-ui, sans-serif; overflow: hidden; }
  #cv { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #ui { position: fixed; right: 8px; top: 8px; width: 250px; background: rgba(251,246,234,.94); padding: 10px 12px; box-shadow: 0 1px 5px rgba(60,40,10,.3); }
  #ui.hidden { display: none; }
  #ui label { display: block; margin: 6px 0 0; font-weight: 600; }
  #ui input[type=range] { width: 100%; }
  #ui button { margin: 5px 4px 0 0; padding: 4px 8px; border: 1px solid #2F2A22; background: #EFE5CF; font: inherit; cursor: pointer; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="ui">
  <b>Bread and Butter</b> shop harness
  <label>month <output id="mo"></output><input id="month" type="range" min="0" max="560" step="1" value="0" /></label>
  <label><input id="reduced" type="checkbox" /> reduced motion</label>
  <div><button id="write">write a line</button><button id="hide">hide ui</button></div>
</div>
<script type="module" src="/src/bread-scene-test.ts"></script>
</body>
</html>
