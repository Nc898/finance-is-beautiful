<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Bread and Butter - grocer harness</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #FBF6EA; font: 12px/1.35 system-ui, sans-serif; overflow: hidden; }
  #cv { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #ui { position: fixed; right: 8px; top: 8px; width: 270px; background: rgba(251,246,234,.94); padding: 10px 12px; box-shadow: 0 1px 5px rgba(60,40,10,.3); }
  #ui.hidden { display: none; }
  #ui label { display: block; margin: 6px 0 0; font-weight: 600; }
  #ui input[type=range] { width: 100%; }
  #ui button { margin: 5px 4px 0 0; padding: 4px 8px; border: 1px solid #2F2A22; background: #EFE5CF; font: inherit; cursor: pointer; }
  #ui .q { display: grid; grid-template-columns: 70px 24px 24px 24px; gap: 2px; align-items: center; margin-top: 3px; }
  #ui .q button { margin: 0; padding: 0 4px; }
  #dbg { font: 11px/1.3 ui-monospace, monospace; white-space: pre; margin-top: 6px; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="ui">
  <b>Bread and Butter</b> grocer harness
  <label>month <output id="mo"></output><input id="month" type="range" min="0" max="560" step="1" value="0" /></label>
  <div><button id="play">play</button><button id="s1">1x</button><button id="s5">5x</button><output id="sp">1x</output></div>
  <div id="qty"></div>
  <label><input id="reduced" type="checkbox" /> reduced motion</label>
  <div><button id="hide">hide ui</button></div>
  <div id="dbg"></div>
</div>
<script type="module" src="/src/bread-grocer-test.ts"></script>
</body>
</html>
