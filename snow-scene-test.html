<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>On a Roll - scene harness</title>
<style>
  :root { --paper:#FBF6EA; --shade:#EFE5CF; --ink:#2F2A22; --muted:#6B6152; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:#FBF6EA; color:var(--ink); font: 12px/1.35 system-ui, sans-serif; overflow:hidden; }
  #cv { position:fixed; inset:0; width:100%; height:100%; display:block; }
  .anchor { position:fixed; transform:translate(-50%,-100%); font:600 11px system-ui; padding:1px 5px; background:rgba(251,246,234,.85); border:1px solid rgba(47,42,34,.5); border-radius:3px; pointer-events:none; white-space:nowrap; }
  #ui { position:fixed; right:8px; top:8px; width:270px; max-height:calc(100vh - 16px); overflow:auto; background:rgba(251,246,234,.94); padding:10px 12px; box-shadow:0 1px 5px rgba(60,40,10,.3); }
  #ui.hidden { display:none; }
  #ui label { display:block; margin:6px 0 0; font-weight:600; font-size:11px; }
  #ui input[type=range] { width:100%; margin:0; }
  #ui output { color:var(--muted); font-variant-numeric:tabular-nums; font-weight:400; }
  #ui button { margin:5px 4px 0 0; padding:4px 8px; border:1px solid var(--ink); background:var(--shade); font:inherit; cursor:pointer; }
  #ui .row { display:flex; gap:12px; align-items:center; margin-top:6px; }
  #stat { margin-top:8px; color:var(--muted); white-space:pre-wrap; font-size:11px; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="anchors"></div>
<div id="ui">
  <b>On a Roll</b> &middot; scene harness
  <div id="sl"></div>
  <div class="row"><label><input id="play" type="checkbox" /> play</label><label><input id="reduced" type="checkbox" /> reduced motion</label><label><input id="anch" type="checkbox" checked /> anchors</label></div>
  <div>
    <button data-p="0">0</button><button data-p="3">m3</button><button data-p="4">m4</button><button data-p="12">m12</button><button data-p="25">m25</button><button data-p="28">m28</button><button data-p="32">m32</button><button data-p="hide">hide ui</button>
  </div>
  <div id="stat"></div>
</div>
<script type="module">
  import { createSnowScene } from '/src/snow/scene/index.ts';
  import { allStrategies, largestStart, horizonMonths } from '/src/snow/engine/index.ts';
  import { DEFAULT_SNOW_INPUTS, DEBTS } from '/src/snow/types.ts';
  const canvas = document.getElementById('cv');
  const scene = createSnowScene(canvas);
  const P = new URLSearchParams(location.search);
  const inputs = DEFAULT_SNOW_INPUTS;
  const big = largestStart(inputs);
  const horizon = horizonMonths(inputs);
  const state = { month: +(P.get('m') || 0), mps: +(P.get('mps') || 1), speed: 1, zoom: +(P.get('zoom') || 1), jump: 0 };
  const defs = [['month', 0, horizon, 0.01], ['mps', 0, 8, 0.1], ['speed', 0.1, 5, 0.1], ['zoom', 1, 2.5, 0.01]];
  const sl = document.getElementById('sl');
  const outs = {};
  for (const [k, a, b, s] of defs) {
    const l = document.createElement('label');
    l.innerHTML = `${k} <output></output><input type="range" min="${a}" max="${b}" step="${s}" value="${state[k]}">`;
    const i = l.querySelector('input'); const o = l.querySelector('output');
    outs[k] = [i, o];
    const upd = () => { state[k] = +i.value; o.textContent = (+i.value).toFixed(2); };
    i.addEventListener('input', upd); upd();
    sl.appendChild(l);
  }
  const setAll = (o) => { Object.assign(state, o); for (const [k, [i, out]] of Object.entries(outs)) { i.value = state[k]; out.textContent = (+state[k]).toFixed(2); } };
  const playEl = document.getElementById('play');
  const reducedEl = document.getElementById('reduced');
  const anchEl = document.getElementById('anch');
  if (P.get('play') === '1') playEl.checked = true;
  if (P.get('reduced') === '1') reducedEl.checked = true;
  const hv = (snap) => ({
    id: snap.id,
    paidOff: snap.paidOff,
    balls: DEBTS.map((d) => {
      const s = snap.debts[d];
      const start = inputs.debts[d].balance;
      return {
        id: d,
        size: s.balance / big,
        progress: Math.max(0, Math.min(1, 1 - s.balance / start)),
        snowfall: s.interest / big,
        rolling: s.payment / big,
        target: snap.target === d,
        paidOff: s.paidOff,
      };
    }),
  });
  const frame = (t) => {
    const [a, b] = allStrategies(inputs, state.month);
    const playing = playEl.checked && state.month < horizon - 1e-6;
    return {
      timeMs: t,
      monthsPerSecond: playing ? state.mps : 0,
      speed: playing ? state.speed : 1,
      hills: [hv(a), hv(b)],
      reducedMotion: reducedEl.checked,
      camera: state.zoom > 1.001 ? { zoom: state.zoom, focus: 'both' } : undefined,
    };
  };
  window.__h = { scene, state, setAll, t: 0, frame, ms: [], frames: 0, horizon, playEl, reducedEl };
  const doc = document;
  const anchors = doc.getElementById('anchors');
  const mk = (id) => { const d = doc.createElement('div'); d.className = 'anchor'; d.id = id; anchors.appendChild(d); return d; };
  const aL = mk('aL'), aR = mk('aR');
  const bt = [];
  for (const h of ['snowball', 'avalanche']) for (const d of DEBTS) bt.push([h, d, mk(`b-${h}-${d}`)]);
  const stat = doc.getElementById('stat');
  const resize = () => scene.resize(innerWidth, innerHeight, Math.min(2, devicePixelRatio || 1));
  addEventListener('resize', resize); resize();
  scene.setInsets({ top: +(P.get('top') || 0), bottom: +(P.get('bottom') || 0), side: +(P.get('side') || 0) });
  let t0 = performance.now(); let lastNow = t0;
  const ms = [];
  const tickFn = (now) => {
    const real = !window.__h.manual;
    const dt = now - lastNow; lastNow = now;
    if (real) {
      if (playEl.checked) {
        const m = Math.min(horizon, state.month + (dt / 1000) * state.mps * state.speed);
        setAll({ month: m });
      }
      window.__h.t = now - t0;
    }
    const a = performance.now();
    scene.render(frame(window.__h.t));
    const b = performance.now();
    ms.push(b - a); if (ms.length > 120) ms.shift();
    window.__h.ms = ms;
    const show = anchEl.checked;
    for (const [d, id] of [[aL, 'snowball'], [aR, 'avalanche']]) {
      d.style.display = show ? '' : 'none';
      const p = scene.labelAnchor(id); d.style.left = p.x + 'px'; d.style.top = p.y + 'px'; d.textContent = id;
    }
    for (const [h, dd, el] of bt) { el.style.display = show ? '' : 'none'; const p = scene.ballAnchor(h, dd); el.style.left = p.x + 'px'; el.style.top = p.y + 'px'; el.textContent = dd; }
    if (real && (window.__h.frames++ % 20 === 0)) {
      const s = ms.slice().sort((x, y) => x - y);
      stat.textContent = `month ${state.month.toFixed(2)}\nrender ms: avg ${(ms.reduce((x, y) => x + y, 0) / ms.length).toFixed(2)} p95 ${s[Math.floor(s.length * 0.95)].toFixed(2)}`;
    }
    requestAnimationFrame(tickFn);
  };
  scene.ready.then(() => { window.__h.ready = true; requestAnimationFrame(tickFn); });
  document.querySelectorAll('button[data-p]').forEach((b) => b.addEventListener('click', () => {
    const p = b.dataset.p;
    if (p === 'hide') document.getElementById('ui').classList.add('hidden');
    else setAll({ month: +p });
  }));
</script>
</body>
</html>
